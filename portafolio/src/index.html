<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Portafolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">


</head>

<body>
  <app-root></app-root>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0 // Se activa cuando al menos el 10% del elemento es visible
      };

      const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            // Opcional: deja de observar el elemento una vez que ya apareció
            observer.unobserve(entry.target);
          }
        });
      }, observerOptions);

      document.querySelectorAll('.fade-in-section').forEach(section => {
        observer.observe(section);
      });
    });
  </script>
</body>

</html>
