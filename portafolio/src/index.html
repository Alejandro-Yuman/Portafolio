<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Portafolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">


</head>

<body>
  <app-root></app-root>
<script>
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }

  (function () {
    const elementos = document.querySelectorAll(".fade-in-section");
    document.documentElement.classList.add("anim-ready");

    function mostrarElementosVisibles() {
      const altoPantalla = window.innerHeight || document.documentElement.clientHeight;

      elementos.forEach((el) => {
        if (el.classList.contains("is-visible")) return;

        const rect = el.getBoundingClientRect();
        if (rect.top <= altoPantalla * 0.95) {
          el.classList.add("is-visible");
        }
      });
    }

    document.addEventListener("DOMContentLoaded", mostrarElementosVisibles);
    window.addEventListener("load", mostrarElementosVisibles);
    window.addEventListener("scroll", mostrarElementosVisibles, { passive: true });
    window.addEventListener("resize", mostrarElementosVisibles, { passive: true });
  })();
</script>
</body>

</html>
