<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Portafolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">


</head>

<body>
  <app-root></app-root>
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const elementos = document.querySelectorAll(".fade-in-section");

    function mostrarElementosVisibles() {
      const altoPantalla = window.innerHeight || document.documentElement.clientHeight;

      elementos.forEach((el) => {
        if (el.classList.contains("is-visible")) return;

        const rect = el.getBoundingClientRect();
        // Si la parte superior del elemento ya entró o ya quedó arriba de la pantalla
        if (rect.top <= altoPantalla * 0.95) {
          el.classList.add("is-visible");
        }
      });
    }

    // Revisar apenas cargue la página (útil si ya hay elementos en pantalla)
    mostrarElementosVisibles();

    // Revisar cada vez que el usuario haga scroll o rote/cambie el tamaño de pantalla
    window.addEventListener("scroll", mostrarElementosVisibles, { passive: true });
    window.addEventListener("resize", mostrarElementosVisibles, { passive: true });
  });
</script>
</body>

</html>
